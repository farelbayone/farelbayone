    <style>
      .card { fill: #1a1b27; stroke: #38BDF8; stroke-opacity: 0.45; stroke-width: 1.5; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #e2e8f0; }
      .sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #38BDF8; }
      .ico { fill: #1a1b27; }
      .tick { fill: none; stroke: #1a1b27; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .pop { animation: float 3.2s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
  </defs>
  <g transform="translate(0 0)">
