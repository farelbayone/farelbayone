<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#7DD3FC"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <style>
      .sweep{animation:run 5s linear infinite}
      @keyframes run{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}
      .dot{transform-box:fill-box;transform-origin:center;animation:beat 2s ease-in-out infinite}
      @keyframes beat{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.6);opacity:1}}
    </style>
  </defs>
  <rect x="0" y="9" width="1000" height="2" rx="1" fill="#38BDF8" fill-opacity=".18"/>
  <rect class="sweep" x="0" y="8.5" width="260" height="3" rx="1.5" fill="url(#sw)"/>
  <circle class="dot" cx="500" cy="10" r="3.5" fill="#38BDF8"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
