<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Farel Bayone Meijabar - IT Application Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#1a1b27"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DD3FC"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".10"/></pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="1200" height="280" rx="20"/></clipPath>
    <style>
      .grid{animation:gridmove 4s linear infinite}
      @keyframes gridmove{from{transform:translateY(0)}to{transform:translateY(40px)}}
      .o1{animation:d1 12s ease-in-out infinite}.o2{animation:d2 15s ease-in-out infinite}.o3{animation:d3 10s ease-in-out infinite}
      @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,40px)}}
      @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-30px)}}
      @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-40px)}}
      .sym{font-family:'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;fill:#38BDF8;opacity:0}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(-320px);opacity:0}}
      .w1{animation:slide 10s linear infinite}.w2{animation:slide 16s linear infinite reverse}
      @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      .bar{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scaleX(.5);opacity:.6}50%{transform:scaleX(1.5);opacity:1}}
      .title{font-family:'Segoe UI', Helvetica, Arial, sans-serif;font-weight:800;font-size:58px;fill:url(#nameGrad);animation:fade 1.4s ease-out both}
      .sub{font-family:'Segoe UI', Helvetica, Arial, sans-serif;font-size:19px;letter-spacing:3px;fill:#cbd5e1;animation:fade 1.8s ease-out .4s both}
      @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <g class="grid"><rect x="0" y="-40" width="1200" height="360" fill="url(#grid)"/></g>
    <g filter="url(#blur)">
      <circle class="o1" cx="200" cy="80" r="110" fill="#0EA5E9" opacity=".35"/>
      <circle class="o2" cx="1000" cy="190" r="130" fill="#A78BFA" opacity=".28"/>
      <circle class="o3" cx="600" cy="250" r="100" fill="#38BDF8" opacity=".22"/>
    </g>
    <text class="sym" x="956" y="310" font-size="20" style="animation:rise 11s linear -8s infinite">01</text>
    <text class="sym" x="418" y="310" font-size="15" style="animation:rise 14s linear -8s infinite">EC2</text>
    <text class="sym" x="411" y="310" font-size="14" style="animation:rise 11s linear -4s infinite">GET /api</text>
    <text class="sym" x="215" y="310" font-size="13" style="animation:rise 12s linear -6s infinite">EC2</text>
    <text class="sym" x="352" y="310" font-size="13" style="animation:rise 14s linear -8s infinite">&lt;/&gt;</text>
    <text class="sym" x="151" y="310" font-size="13" style="animation:rise 9s linear -3s infinite">01</text>
    <text class="sym" x="91" y="310" font-size="20" style="animation:rise 10s linear -7s infinite">01</text>
    <text class="sym" x="430" y="310" font-size="16" style="animation:rise 13s linear -4s infinite">EC2</text>
    <text class="sym" x="39" y="310" font-size="14" style="animation:rise 11s linear -10s infinite">AI</text>
    <text class="sym" x="863" y="310" font-size="14" style="animation:rise 13s linear -4s infinite">λ</text>
    <text class="sym" x="500" y="310" font-size="17" style="animation:rise 8s linear -1s infinite">01</text>
    <text class="sym" x="251" y="310" font-size="19" style="animation:rise 8s linear -4s infinite">SQL</text>
    <text class="sym" x="166" y="310" font-size="13" style="animation:rise 14s linear -10s infinite">{ }</text>
    <text class="sym" x="467" y="310" font-size="16" style="animation:rise 8s linear -7s infinite">SQL</text>
    <text class="sym" x="843" y="310" font-size="19" style="animation:rise 8s linear -3s infinite">POST</text>
    <text class="sym" x="582" y="310" font-size="18" style="animation:rise 8s linear -4s infinite">λ</text>
    <text class="title" x="600" y="135" text-anchor="middle" filter="url(#glow)">Farel Bayone Meijabar</text>
    <text class="sub" x="600" y="178" text-anchor="middle">IT APPLICATION DEVELOPER  •  API ENGINEERING  •  AI &amp; CLOUD</text>
    <rect class="bar" x="540" y="198" width="120" height="3" rx="1.5" fill="url(#nameGrad)"/>
    <path class="w1" fill="#38BDF8" fill-opacity=".22" d="M0,236 q150,-30 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V400 H0 Z"/>
    <path class="w2" fill="#A78BFA" fill-opacity=".16" d="M0,250 q150,-22 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V400 H0 Z"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="278.5" rx="19.5" fill="none" stroke="#38BDF8" stroke-opacity=".4" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
